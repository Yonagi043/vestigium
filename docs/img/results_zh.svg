<svg xmlns="http://www.w3.org/2000/svg" width="880" height="386" viewBox="0 0 880 386" role="img" aria-labelledby="t d"><title id="t">Claude Haiku 4.5 的结果</title><desc id="d">准确率（27 道文字难题）: Vestigium 91.8%, 整篇文本 + 搜索 91.2% / 91.4%*, 直接读 PDF 61.7%. 花费和用时：Vestigium ÷ 对方: 对比整篇文本 + 搜索: 花费 0.51, 用时 0.54; 对比直接读 PDF: 花费 0.25, 用时 0.60. 主分析（31 题）：Vestigium 减整篇文本 = +1.2 个点 [−1.8, +4.4]。不劣（界限是 5 个点），但没有证明更准。 Claude Opus 5.5（同样 27 题）：Vestigium 100%，整篇文本 99.6%。 Claude Code；新出的难题，长篇英文公开报告；方法开跑前写死；AI 盲评判分</desc><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', 'Noto Sans CJK SC', monospace}</style><rect x="1" y="1" width="878" height="384" rx="14" fill="#ffffff" stroke="#e1e0d9"/><text class="s" x="28.0" y="40.0" font-size="17" fill="#0b0b0b" font-weight="600">Claude Haiku 4.5 的结果</text><text class="s" x="28.0" y="62.0" font-size="12.5" fill="#52514e">Vestigium 对比两种做法：把整篇文档存成文本文件、用 Claude Code 自带工具搜索；直接读 PDF。</text><text class="s" x="28.0" y="98.0" font-size="13.5" fill="#0b0b0b" font-weight="600">准确率（27 道文字难题）</text><text class="s" x="28.0" y="137.0" font-size="12.5" fill="#0b0b0b" font-weight="600">Vestigium</text><path d="M164.0,124.0h150.2a4,4 0 0 1 4,4v10.0a4,4 0 0 1 -4,4h-150.2z" fill="#2a78d6"/><text class="s" x="326.2" y="137.0" font-size="12.5" fill="#0b0b0b">91.8%</text><text class="s" x="28.0" y="173.0" font-size="12.5" fill="#0b0b0b">整篇文本 + 搜索</text><path d="M164.0,160.0h149.2a4,4 0 0 1 4,4v10.0a4,4 0 0 1 -4,4h-149.2z" fill="#a3a19a"/><text class="s" x="325.2" y="173.0" font-size="12.5" fill="#0b0b0b">91.2% / 91.4%*</text><text class="s" x="28.0" y="209.0" font-size="12.5" fill="#0b0b0b">直接读 PDF</text><path d="M164.0,196.0h99.7a4,4 0 0 1 4,4v10.0a4,4 0 0 1 -4,4h-99.7z" fill="#a3a19a"/><text class="s" x="275.7" y="209.0" font-size="1