<svg xmlns="http://www.w3.org/2000/svg" width="880" height="403" viewBox="0 0 880 403" role="img" aria-labelledby="t d"><title id="t">Results with Claude Haiku 4.5</title><desc id="d">Accuracy on 27 hard text questions: Vestigium 91.8%, Whole text + search 91.2% / 91.4%*, PDF, read directly 61.7%. Cost and time: Vestigium ÷ the other setup: vs whole text + search: Cost 0.51, Time 0.54; vs PDF, read directly: Cost 0.25, Time 0.60. Main analysis, 31 questions: Vestigium minus whole text = +1.2 points [−1.8, +4.4]. Not worse (the bound was 5 points); not shown to be more accurate. Claude Opus 5.5 on the same 27 questions: Vestigium 100%, whole text 99.6%. Claude Code; new hard questions on long public English reports; method fixed before the runs; graded blind by an AI judge.</desc><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', 'Noto Sans CJK SC', monospace}</style><rect x="1" y="1" width="878" height="401" rx="14" fill="#ffffff" stroke="#e1e0d9"/><text class="s" x="28.0" y="40.0" font-size="17" fill="#0b0b0b" font-weight="600">Results with Claude Haiku 4.5</text><text class="s" x="28.0" y="62.0" font-size="12.5" fill="#52514e">Vestigium against the whole document as a text file (searched with Claude Code's own tools) and against the PDF itself.</text><text class="s" x="28.0" y="98.0" font-size="13.5" fill="#0b0b0b" font-weight="600">Accuracy on 27 hard text questions</text><text class="s" x="28.0" y="137.0" font-size="12.5" fill="#0b0b0b" font-weight="600">Vestigium</text><path d="M164.0,124.0h150.2a4,4 0 0 1 4,4v10.0a4,4 0 0 1 -4,4h-150.2z" fill="#2a78d6"/><text class="s" x="326.2" y="137.0" font-size="12.5" fill="#0b0b0b">91.8%</text><text class="s" x="28.0" y="173.0" font-size="12.5" fill="#0b0b0b">Whole text + search</text><path d="M164.0,160.0h149.2a4,4 0 0 1 4,4v10.0a4,4 0 0 1 -4,4h-149.2z" fill="#a3a19a"/><text class="s" x="325.2" y="173.0" font-size="12.5" fill="#0b0b0b">91.2% / 91.4%*</text><text class="s" x="28.0" y="209.0" font-size="12.5" fill="#0b0b0b">PDF, read directly</text><path d="M164.0,196.0h99.7a4,4 0 0 1 4,4v10.0a4,4 0 0 1 -4,4h-99.7z" fill="#a3a19a"/><text class="s" x="275.7" y="209.0" font-size="12.5" fill="#0b0b0b">61.7%</text><line x1="164" y1="118" x2="164" y2="224" stroke="#c3c2b7"/><text class="s" x="164.0" y="238.0" font-size="11" fill="#898781" text-anchor="middle">0%</text><text class="s" x="248.0" y="238.0" font-size="11" fill="#898781" text-anchor="middle">50%</text><text class="s" x="332.0" y="238.0" font-size="11" fill="#898781" text-anchor="middle">100%</text><text class="s" x="28.0" y="258.0" font-size="11" fill="#898781">* two runs of the whole text</text><text class="s" x="28.0" y="277.0" font-size="12" fill="#52514e">Main analysis, 31 questions: Vestigium minus whole text =</text><text class="s" x="28.0" y="294.0" font-size="12" fill="#52514e">+1.2 points [−1.8, +4.4]. Not worse (the bound was 5 points); not</text><text class="s" x="28.0" y="311.0" font-size="12" fill="#52514e">shown to be more accurate.</text><text class="s" x="468.0" y="98.0" font-size="13.5" fill="#0b0b0b" font-weight="600">Cost and time: Vestigium ÷ the other setup</text><text class="s" x="756.0" y="118.0" font-size="11" fill="#898781" text-anchor="end">1 = the other setup</text><text class="s" x="468.0" y="134.0" font-size="12.5" fill="#0b0b0b">vs whole text + search</text><text class="s" x="468.0" y="155.0" font-size="12" fill="#52514e">Cost</text><rect x="520" y="144" width="236" height="14" rx="4" fill="#cde2fb"/><path d="M520.0,144.0h116.4a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-116.4z" fill="#2a78d6"/><text class="s" x="764.0" y="155.0" font-size="12.5" fill="#0b0b0b" font-weight="600">0.51</text><text class="s" x="468.0" y="177.0" font-size="12" fill="#52514e">Time</text><rect 